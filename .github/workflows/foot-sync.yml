name: Football provider sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fixtures and settle finished 1X2 tickets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          FOOT_SYNC_CRON_SECRET: ${{ secrets.FOOT_SYNC_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$FOOT_SYNC_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/foot-sync" \
            -H "x-cron-secret: $FOOT_SYNC_CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'