name: PMU provider sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync real PMU races and starters
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PMU_SYNC_SECRET: ${{ secrets.PMU_SYNC_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$PMU_SYNC_SECRET"
          curl --fail-with-body --silent --show-error             -X POST "$SUPABASE_URL/functions/v1/pmu-sync"             -H "x-pmu-sync-secret: $PMU_SYNC_SECRET"             -H "Content-Type: application/json"             -d '{}'